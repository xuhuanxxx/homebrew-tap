name: Check AliyunX and MaxCX formulae
on:
  push:
    branches: ['prepare/aliyun-personal', 'main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Register checkout as a runner-only tap
        shell: bash
        run: |
          tap_root="$(brew --repository)/Library/Taps/xuhuanxxx/homebrew-tap"
          mkdir -p "$(dirname "$tap_root")"
          ln -s "$GITHUB_WORKSPACE" "$tap_root"
      - name: Build and test without linking the official command
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install xuhuanxxx/tap/aliyunx xuhuanxxx/tap/maxcx
          brew test xuhuanxxx/tap/aliyunx
          brew test xuhuanxxx/tap/maxcx
          test -x "$(brew --prefix)/bin/aliyunx"
          test -x "$(brew --prefix)/bin/maxcx"
          test ! -L "$(brew --prefix)/bin/aliyun"
          test ! -L "$(brew --prefix)/bin/maxc"
